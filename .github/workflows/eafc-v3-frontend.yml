name: EAFC V3 frontend checks
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/eafc-v3-frontend.yml'
  push:
    branches:
      - feature/eafc-v3-real-rebuild
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --run

name: EAFC V4 frontend verification
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/eafc-v4.yml"
  push:
    branches:
      - feature/eafc-v4-clean-frontend
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Run frontend tests
        run: npm run test -- --run

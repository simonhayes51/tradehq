name: V4 clean frontend checks
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/v4-frontend.yml"
  push:
    branches:
      - feature/eafc-v4-clean-frontend
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test -- --run

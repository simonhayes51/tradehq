# Local/dev "docker compose up" convenience only. The actual Coolify
# production deployment does NOT use this file to orchestrate auto_sync's
# workers - PlayerSync, PriceSync, SBCSync and SalesSync are each their
# own Dockerfile-based Coolify resource (base directory /auto_sync, a
# dedicated Dockerfile.player / Dockerfile.price / Dockerfile.sbc /
# Dockerfile.sales, no domain, no port), with PlayerSync and SBCSync run
# as Coolify Scheduled Tasks and PriceSync/SalesSync run as continuous
# services - see auto_sync/COOLIFY.md for the exact setup of each. This
# file mirrors that split (same four dedicated Dockerfiles, same "no
# ports" rule) so `docker compose up` still gives a working local stack,
# but Coolify's own resource config is the source of truth for how each
# worker actually runs in production.
#
# DATABASE_URL is external, not something this file provisions. There is
# deliberately no `postgres:` service here - the real deployment points
# every service at one already-existing, already-restored Postgres
# instance via the DATABASE_URL env var Coolify injects; this compose
# file does the same (reads DATABASE_URL from the environment/.env
# instead of constructing a connection string to a local container).
# `docker compose up` therefore expects DATABASE_URL to already be set to
# a reachable Postgres (e.g. a local `docker run postgres:16 ...` per
# auto_sync/README.md, or the same instance Coolify uses) - it will not
# spin up a second, separate database for you.
#
# Every service reads the same DATABASE_URL. backend/main.py already
# treats PLAYER_DATABASE_URL / WATCHLIST_DATABASE_URL as optional
# overrides that default to DATABASE_URL when unset (see main.py:95-97) -
# so simply not setting those two env vars is what makes this "one
# database" rather than the three-pool split the Railway deployment used.
# Nothing in the code had to change for that; it was already the
# supported path.
#
# Table-name overlap between backend's migrations and auto_sync's own
# schema (scrape_queue, crawler_*, market_events, pipeline_heartbeats,
# sbc_*) is not a collision - backend's migration comments say these are
# "for auto_sync" and both sides use CREATE TABLE IF NOT EXISTS.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ENV: production
      PORT: 8000
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY}
      DISCORD_SYNC_COMMANDS_ON_BOOT: ${DISCORD_SYNC_COMMANDS_ON_BOOT:-1}
      DISCORD_COMMAND_SYNC_STRICT: ${DISCORD_COMMAND_SYNC_STRICT:-0}
      DISCORD_EXPECTED_APPLICATION_ID: ${DISCORD_EXPECTED_APPLICATION_ID:-1408193521986437251}
      DISCORD_COMMAND_SYNC_GUILD_IDS: ${DISCORD_COMMAND_SYNC_GUILD_IDS:-818516082934546432}
      DISCORD_MEMBER_ROLE_ID: ${DISCORD_MEMBER_ROLE_ID}
      DISCORD_INVITE_URL: ${DISCORD_INVITE_URL}
      DISCORD_OPPORTUNITY_CHANNEL_ID: ${DISCORD_OPPORTUNITY_CHANNEL_ID}
      DISCORD_OPPORTUNITY_BATCH_MIN: ${DISCORD_OPPORTUNITY_BATCH_MIN:-5}
      DISCORD_OPPORTUNITY_COOLDOWN_MINUTES: ${DISCORD_OPPORTUNITY_COOLDOWN_MINUTES:-180}
      DISCORD_OPPORTUNITY_DEDUP_HOURS: ${DISCORD_OPPORTUNITY_DEDUP_HOURS:-24}
      DISCORD_PROOF_CHANNEL_ID: ${DISCORD_PROOF_CHANNEL_ID}
      DISCORD_PROOF_REPORT_TIMEZONE: ${DISCORD_PROOF_REPORT_TIMEZONE:-Europe/London}
      DISCORD_PROOF_REPORT_HOUR: ${DISCORD_PROOF_REPORT_HOUR:-21}
      DISCORD_PROOF_REPORT_MINUTE: ${DISCORD_PROOF_REPORT_MINUTE:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID}
      STRIPE_SEASON_PRICE_ID: ${STRIPE_SEASON_PRICE_ID}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL}
        VITE_API_BASE_URL: ${PUBLIC_API_URL}
        VITE_DISCORD_INVITE_URL: ${VITE_DISCORD_INVITE_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # --- auto_sync workers --------------------------------------------------
  # Four dedicated Dockerfiles, not one shared image with overridden
  # commands - see each Dockerfile's own header comment for why each
  # worker needs its own base image/behaviour. No worker exposes a port
  # or has a domain; all four only ever talk outbound to fut.gg and
  # DATABASE_URL.
  #
  # futgg_price_sync.py (the old per-card Playwright price scraper) is
  # obsolete now that futgg_bulk_price_sync.py's bulk feed replaces it
  # (~27k cards from one page load vs. ~2s/card with ~26% failing - see
  # that script's own docstring) and is intentionally NOT a service here.
  # The script itself is left in the repo (not deleted), just undeployed.

  futgg_player_worker:
    build:
      context: ./auto_sync
      dockerfile: Dockerfile.player
    # One-shot (crawl_once(), exits on completion) - `restart: "no"` here
    # so a local `docker compose up` behaves the same way the Coolify
    # Scheduled Task does (run once, stay stopped) instead of Compose's
    # default restart policy turning a clean exit into a restart loop -
    # exactly the bug this whole change fixes. Use
    # `docker compose run --rm futgg_player_worker` to trigger a run
    # on demand locally.
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  futgg_bulk_price_worker:
    build:
      context: ./auto_sync
      dockerfile: Dockerfile.price
    # Long-running (run_forever(): internal ingest -> sleep -> repeat
    # loop, holds a warm Playwright page between cycles) - stays
    # `unless-stopped`, must run as exactly one continuous instance.
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FUTGG_BULK_APPLY: "true"

  futgg_sbc_worker:
    build:
      context: ./auto_sync
      dockerfile: Dockerfile.sbc
    # One-shot (crawl_once(), exits on completion), same reasoning as
    # futgg_player_worker above - Coolify Scheduled Task in production,
    # `restart: "no"` + `docker compose run --rm futgg_sbc_worker` here.
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}

  futgg_sales_worker:
    build:
      context: ./auto_sync
      dockerfile: Dockerfile.sales
    # Long-running (run_forever(): one anchor page load, then internal
    # batch sign+fetch -> sleep -> repeat loop, holds a warm Playwright
    # page between cycles), same reasoning as futgg_bulk_price_worker
    # above - stays `unless-stopped`, must run as exactly one continuous
    # instance.
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}

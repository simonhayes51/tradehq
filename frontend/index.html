<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- No user-scalable=no here on purpose - it fails WCAG 1.4.4 and iOS ignores it anyway -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#91db32" />
    <title>EAFC.Live — EA FC Trading Opportunities & Market Data</title>
    <meta name="description" content="Find EA FC Ultimate Team cards worth buying by comparing live prices with what cards are actually selling for. Real completed sales, fair value on every card, and live opportunities." />
    <!-- eafc.live is the marketing identity; app.eafc.live runs the same
         build but is the logged-in app, not the canonical site. No
         og:image yet - leaving it out rather than faking one. -->
    <link rel="canonical" href="https://eafc.live/" />
    <meta property="og:title" content="EAFC.Live — EA FC Trading Opportunities & Market Data" />
    <meta property="og:description" content="Find cards worth buying by comparing live prices with what they're actually selling for." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eafc.live/" />
    <meta property="og:site_name" content="EAFC.Live" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EAFC.Live — EA FC Trading Opportunities & Market Data" />
    <meta name="twitter:description" content="Find cards worth buying by comparing live prices with what they're actually selling for." />
    <script>
      // This one index.html serves both eafc.live and app.eafc.live (see
      // src/lib/domains.js), so fix the canonical/robots tags per-domain
      // before React even mounts. Only helps search engines, not social
      // previews - Discord/Twitter's unfurlers don't run JS.
      if (location.hostname !== "eafc.live" && location.hostname !== "www.eafc.live") {
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", "https://" + location.hostname + "/");
        var robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex";
        document.head.appendChild(robots);
      }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Icon filenames carry a version suffix (-v2, -v3...) instead of being
         overwritten in place - browsers, iOS's apple-touch-icon cache, and
         any CDN in front all cache by URL, so replacing the bytes at the
         same path leaves everyone who's already seen it stuck on the old
         icon forever (bit us for real on 2026-09-03, and again separately
         for the Discord embed logo - see discord_embeds.py's
         brand_author). Next icon change, bump the suffix here AND in
         manifest.json, src/utils/pwa.js, TradeShareCardArt.jsx and
         TradeSummaryCardArt.jsx. -->
    <link rel="icon" href="/icons/icon-192x192-v2.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192-v2.png" />

    <!-- Fonts / styles you might need -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite entry (must exist) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

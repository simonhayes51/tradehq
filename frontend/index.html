<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no removed: blocking pinch-zoom is an accessibility
         failure (WCAG 1.4.4) and iOS ignores it anyway -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#91db32" />
    <title>EAFC Live — EA FC Trading Opportunities & Market Data</title>
    <meta name="description" content="Find EA FC Ultimate Team cards worth buying by comparing live prices with what cards are actually selling for. Real completed sales, fair value on every card, and live opportunities." />
    <!-- eafc.live (this build's public-site host) is the canonical
         marketing identity - app.eafc.live is the same build serving the
         logged-in app, and must not claim to be it. No og:image exists
         yet in this repo - omitted rather than a made-up one; needs a
         real asset before this is complete (see the report). -->
    <link rel="canonical" href="https://eafc.live/" />
    <meta property="og:title" content="EAFC Live — EA FC Trading Opportunities & Market Data" />
    <meta property="og:description" content="Find cards worth buying by comparing live prices with what they're actually selling for." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eafc.live/" />
    <meta property="og:site_name" content="EAFC Live" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EAFC Live — EA FC Trading Opportunities & Market Data" />
    <meta name="twitter:description" content="Find cards worth buying by comparing live prices with what they're actually selling for." />
    <script>
      // One static index.html serves both eafc.live (public) and
      // app.eafc.live (the app) - see src/lib/domains.js. A crawler that
      // executes JS (Google does; link-unfurlers like Discord/Twitter's
      // generally do NOT, so this doesn't help social-preview accuracy
      // on app.eafc.live, only search-engine canonical/indexing) sees
      // this correction before React mounts.
      if (location.hostname !== "eafc.live" && location.hostname !== "www.eafc.live") {
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", "https://" + location.hostname + "/");
        var robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex";
        document.head.appendChild(robots);
      }
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Optional icons (place actual files in /public/icons/) -->
    <link rel="icon" href="/icons/icon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Fonts / styles you might need -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite entry (must exist) -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
